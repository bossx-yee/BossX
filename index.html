<script>

  const el = document.getElementById(id);
  if (el) el.innerHTML = html;

  const el = document.getElementById(id);
  if (el) el.src = src;

  if (el) el.style[prop] = value;

function safeGetEl(id) {

  const existingMessage = document.querySelector('.success-message');

  const messageDiv = document.createElement('div');

  messageDiv.textContent = message;
  document.body.appendChild(messageDiv);
  setTimeout(() => messageDiv.remove(), 3000);

function loadValidationState() {

function resumeValidation() {
  if (!isValidationRunning || !validationStartTime) return;
  const now = Date.now();
  const rewardPerSecond = stakedAmount * 0.000000038580246913580247;
  const startTime = new Date(validationStartTime);
  const nowDate = new Date(now);
  const todaySixAM = new Date(nowDate);
  todaySixAM.setHours(6, 0, 0, 0);
  if (startTime < todaySixAM && nowDate >= todaySixAM) {
    const secondsUntilSixAM = (todaySixAM.getTime() - validationStartTime) / 1000;
    if (secondsUntilSixAM >= 60) {
      const fullCycles = Math.floor(secondsUntilSixAM / 60);
      const fullReward = rewardPerSecond * 60 * fullCycles;
      totalRewardBalance += fullReward;
      shareCounter += fullCycles;
      appendLog('[INFO] Resume: ' + fullCycles + ' auto claim terhitung sampai 06:00');
    }
    isValidationRunning = false;
    validationStartTime = null;
    const powerBtn = safeGetEl('power-btn');
    const statusText = safeGetEl('validation-status');
    const countdownDisplay = safeGetEl('countdown-display');
    if (powerBtn) { powerBtn.classList.remove('on'); powerBtn.classList.add('off'); }
    if (statusText) { statusText.textContent = 'Dihentikan otomatis jam 06:00 - Klik ON untuk lanjut'; statusText.style.display = 'block'; }
    if (countdownDisplay) countdownDisplay.style.display = 'none';
    appendLog('[STATUS] Validasi dihentikan otomatis pada jam 06:00 (saat resume)');
    saveValidationState();
    updateBalanceDisplays();
    return;
  }
  const elapsedSeconds = (now - validationStartTime) / 1000;
  currentValidationReward = rewardPerSecond * (elapsedSeconds % 60);
  const fullCycles = Math.floor(elapsedSeconds / 60);
  if (fullCycles > shareCounter) {
    const missedCycles = fullCycles - shareCounter;
    const missedReward = rewardPerSecond * 60 * missedCycles;
    totalRewardBalance += missedReward;
    shareCounter = fullCycles;
    appendLog('[INFO] Resume: ' + missedCycles + ' auto claim terlewat ditambahkan ke pending reward');
  }
  const powerBtn = safeGetEl('power-btn');
  const statusText = safeGetEl('validation-status');
  const countdownDisplay = safeGetEl('countdown-display');
  if (powerBtn) { powerBtn.classList.remove('off'); powerBtn.classList.add('on'); }
  if (statusText) { statusText.textContent = 'Auto-stop setiap jam 06:00'; statusText.style.display = 'block'; }
  if (countdownDisplay) countdownDisplay.style.display = 'block';
  startCountdown();
  startValidationRunning();
  startMasaCountdown();
  appendLog('[INFO] Validasi diresume dari ' + formatDate(startTime));
  saveValidationState();
  updateBalanceDisplays();
}

function updateClock() {
  const now = new Date();
  const timeOptions = { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
  const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  safeSetText('time', now.toLocaleTimeString('id-ID', timeOptions));
  safeSetText('date', now.toLocaleDateString('id-ID', dateOptions));
}
function getTimestamp() {
  const now = new Date();
  return '[' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0') + ']';
}
function formatDate(date) {
  return date.toLocaleString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function formatAmount(amount) {
  return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 8 }).format(amount);
}
function formatTimeAgo(timestamp) {
  const diff = Date.now() - timestamp;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (minutes < 1) return 'Baru saja';
  if (minutes < 60) return minutes + ' menit lalu';
  if (hours < 24) return hours + ' jam lalu';
  if (days < 7) return days + ' hari lalu';
  return new Date(timestamp).toLocaleDateString('id-ID');
}

function appendLog(message, logType) {
  logType = logType || 'normal';
  const logOutput = safeGetEl('log-output');
  if (!logOutput) return;
  if (message.indexOf('GPU#0') !== -1) {
    const randomTemp = Math.floor(Math.random() * 15) + 65;
    const randomHash = (Math.random() * 3 + 47).toFixed(1);
    const randomFan = Math.floor(Math.random() * 10) + 80;
    message = message.replace(/48\.4/, randomHash).replace(/78|79/, randomTemp).replace(/89|90/, randomFan);
  } else if (message.indexOf('latency spike') !== -1) {
    const randomLatency = Math.floor(Math.random() * 50) + 100;
    message = message.replace(/112/, randomLatency);
  } else if (message.indexOf('Power consumption') !== -1) {
    const randomPower = Math.floor(Math.random() * 200) + 3200;
    message = message.replace(/3416/, randomPower);
  }
  const fullMessage = getTimestamp() + ' ' + message;
  const logEntry = document.createElement('p');
  logEntry.classList.add('log-entry');
  if (logType === 'pk-success') logEntry.classList.add('pk-success');
  else if (logType === 'pk-error') logEntry.classList.add('pk-error');
  else if (message.indexOf('auto claim') !== -1 || message.indexOf('Accepted Share') !== -1) logEntry.classList.add('auto-claim');
  logEntry.textContent = fullMessage;
  logOutput.appendChild(logEntry);
  while (logOutput.children.length > 100) logOutput.removeChild(logOutput.firstChild);
  logOutput.scrollTop = logOutput.scrollHeight;
}

function forceStopValidation(reason) {
  reason = reason || 'otomatis pada jam 06:00';
  if (!isValidationRunning) return;
  isValidationRunning = false;
  validationStartTime = null;
  const powerBtn = safeGetEl('power-btn');
  const statusText = safeGetEl('validation-status');

  if (powerBtn) { powerBtn.classList.remove('on'); powerBtn.classList.add('off'); }
  if (statusText) { statusText.textContent = 'Dihentikan otomatis jam 06:00 - Klik ON untuk lanjut'; statusText.style.display = 'block'; }
  if (countdownDisplay) countdownDisplay.style.display = 'none';
  if (countdownInterval) clearInterval(countdownInterval);
  stopValidationRunning();
  if (masaInterval) clearInterval(masaInterval);
  appendLog('[STATUS] Validasi dihentikan ' + reason);
  showSuccessMessage('Validasi dihentikan ' + reason + '. Silakan aktifkan kembali untuk melanjutkan.');
  saveValidationState();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function startCountdown() {
  function updateCountdown() {
    const now = new Date();
    const target = new Date();
    target.setHours(6, 0, 0, 0);
    if (now >= target) target.setDate(target.getDate() + 1);
    const diff = target.getTime() - now.getTime();
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    safeSetText('countdown-time',
      hours.toString().padStart(2, '0') + ':' + minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0'));
    if (diff <= 0 && isValidationRunning) {
      forceStopValidation('otomatis pada jam 06:00');
      return;
    }
  }
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 1000);
}

function checkSixAMStop() {
  const now = new Date();
  if (now.getHours() === 6 && now.getMinutes() === 0 && now.getSeconds() < 5) {
    if (isValidationRunning) forceStopValidation('otomatis pada jam 06:00');
  }
}

function submitWithdrawal() {
  const address = safeGetEl('withdrawal-address')?.value.trim();
  const amount = parseFloat(safeGetEl('withdrawal-amount')?.value) || 0;
  const selectedNetwork = document.querySelector('input[name="withdrawal-network"]:checked');
  const networkValue = selectedNetwork ? selectedNetwork.value : 'TRC20';
  const config = withdrawalConfig[activeWithdrawalTab]?.networks[networkValue];
  if (!config) { showErrorMessage('Konfigurasi network tidak ditemukan!'); return; }
  const balance = activeWithdrawalTab === 'USDT' ? usdtBalance : bossxBalance;
  const fee = config.fee;
  const minAmount = config.min;
  if (!address) { showErrorMessage('Alamat wallet tujuan tidak boleh kosong!'); return; }
  if (address.length < 30) { showErrorMessage('Alamat wallet tidak valid!'); return; }
  if (amount < minAmount) { showErrorMessage('Minimal withdrawal adalah ' + minAmount + ' ' + activeWithdrawalTab + '!'); return; }
  if (amount > balance) { showErrorMessage('Saldo tidak mencukupi!'); return; }
  if ((amount + fee) > balance) { showErrorMessage('Saldo tidak cukup untuk membayar fee ' + fee + ' ' + activeWithdrawalTab + '!'); return; }
  if (activeWithdrawalTab === 'USDT') usdtBalance -= amount;
  else bossxBalance -= amount;
  const newWithdrawal = { id: Date.now().toString(), amount: amount, fee: fee, received: amount - fee, address: address, network: networkValue, status: 'processing', timestamp: new Date(), txHash: generateFakeTxHash() };
  if (!withdrawalHistory[activeWithdrawalTab]) withdrawalHistory[activeWithdrawalTab] = [];
  withdrawalHistory[activeWithdrawalTab].unshift(newWithdrawal);
  const addrInput = safeGetEl('withdrawal-address');
  const amtInput = safeGetEl('withdrawal-amount');
  if (addrInput) addrInput.value = '';
  if (amtInput) amtInput.value = '';
  updateBalanceDisplays();
  updateWithdrawalContent();
  showSuccessMessage('Withdrawal ' + amount + ' ' + activeWithdrawalTab + ' berhasil disubmit!');
  saveValidationState();
}

function generateFakeTxHash() {
  const chars = '0123456789abcdef';
  let result = '';
  for (let i = 0; i < 64; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
  return result;
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { showSuccessMessage('Berhasil disalin ke clipboard!'); }).catch(function() { fallbackCopy(text); });
  } else fallbackCopy(text);
}

function fallbackCopy(text) {
  const textArea = document.createElement('textarea');
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    showSuccessMessage('Berhasil disalin ke clipboard!');
  } catch (err) {
    showSuccessMessage('Gagal menyalin. Silakan copy manual.');
  }
  document.body.removeChild(textArea);
}

function debounce(func, delay) {
  let timeout;
  return function() {
    const args = arguments;
    clearTimeout(timeout);
    timeout = setTimeout(function() { func.apply(null, args); }, delay);
  };
}

const debouncedLoadMarketData = debounce(loadMarketData, 300);

function loadMarketData(pair) {
  const symbol = pair.replace('/', '').toUpperCase();
  if (isBossXPair(symbol)) {
    safeSetHTML('current-price', '<span class="text-cyan-300 text-sm">Internal Token</span>');
    safeSetText('price-change', '—');
    const pc = safeGetEl('price-change');
    if (pc) pc.className = 'text-lg font-bold text-cyan-300';
    safeSetText('volume', '—');
    safeSetText('high-low', '— / —');
    return;
  }
  fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=' + symbol)
    .then(function(response) { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })
    .then(function(data) {
      const changePercent = data.priceChangePercent > 0 ? '+' + parseFloat(data.priceChangePercent).toFixed(2) + '%' : parseFloat(data.priceChangePercent).toFixed(2) + '%';
      const changeColor = data.priceChangePercent > 0 ? 'text-emerald-400' : 'text-rose-400';
      safeSetText('current-price', '$' + parseFloat(data.lastPrice).toLocaleString());
      safeSetText('price-change', changePercent);
      const pc = safeGetEl('price-change');
      if (pc) pc.className = 'text-lg font-bold ' + changeColor;

function loadOrderBook(symbol) {

    safeSetHTML('buy-orders', '<tr><td colspan="3" class="text-center text-cyan-300 py-8 text-sm"><i data-lucide="info" class="w-8 h-8 mx-auto mb-2 text-cyan-400"></i><br>Order book tidak tersedia untuk BossX</td></tr>');
    safeSetHTML('sell-orders', '<tr><td colspan="3" class="text-center text-cyan-300 py-8 text-sm"><i data-lucide="info" class="w-8 h-8 mx-auto mb-2 text-cyan-400"></i><br>Order book tidak tersedia untuk BossX</td></tr>');

    if (typeof lucide !== 'undefined') lucide.createIcons();
    return;
  }
  try {
    wsDepth = new WebSocket('wss://stream.binance.com:9443/ws/' + symbol.toLowerCase() + '@depth@100ms');
    wsDepth.onmessage = function(event) { updateOrderBook(JSON.parse(event.data)); };
    wsDepth.onerror = function(error) { console.error('WebSocket depth error:', error); fetchOrderBook(symbol); };
  } catch (e) { fetchOrderBook(symbol); }
}

function fetchOrderBook(symbol) {
  fetch('https://api.binance.com/api/v3/depth?symbol=' + symbol + '&limit=50')
    .then(function(response) { return response.json(); })
    .then(function(data) { updateOrderBook(data); })
    .catch(function(err) { console.error('Error fetching order book:', err); });
}

function updateOrderBook(data) {
  requestAnimationFrame(function() {
    const asks = data.a || data.asks || [];
    const bids = data.b || data.bids || [];
    const buyOrdersEl = safeGetEl('buy-orders');
    const sellOrdersEl = safeGetEl('sell-orders');
    if (buyOrdersEl) buyOrdersEl.innerHTML = '';
    if (sellOrdersEl) sellOrdersEl.innerHTML = '';
    if (asks.length === 0 && bids.length === 0) return;
    const allVolumes = asks.map(function(a) { return parseFloat(a[1]); }).concat(bids.map(function(b) { return parseFloat(b[1]); }));
    const maxVolume = Math.max.apply(null, allVolumes.concat([1]));
    if (sellOrdersEl) {
      asks.slice(0, 15).reverse().forEach(function(ask) {
        const price = parseFloat(ask[0]);
        const amount = parseFloat(ask[1]);
        const total = price * amount;
        const width = (amount / maxVolume * 100) + '%';
        const row = document.createElement('tr');
        row.className = 'relative';
        row.innerHTML = '<td class="sell-order">' + price.toFixed(2) + '</td><td>' + amount.toFixed(6) + '</td><td>' + total.toFixed(2) + '</td><div class="depth-bar sell-depth" style="width: ' + width + ';"></div>';
        sellOrdersEl.appendChild(row);
      });
    }
    if (buyOrdersEl) {
      bids.slice(0, 15).forEach(function(bid) {
        const price = parseFloat(bid[0]);
        const amount = parseFloat(bid[1]);
        const total = price * amount;
        const width = (amount / maxVolume * 100) + '%';
        const row = document.createElement('tr');
        row.className = 'relative';
        row.innerHTML = '<td class="buy-order">' + price.toFixed(2) + '</td><td>' + amount.toFixed(6) + '</td><td>' + total.toFixed(2) + '</td><div class="depth-bar buy-depth" style="width: ' + width + ';"></div>';
        buyOrdersEl.appendChild(row);
      });
    }
    if (asks.length > 0 && bids.length > 0) {
      const bestBid = parseFloat(bids[0][0]);
      const bestAsk = parseFloat(asks[0][0]);
      const spreadValue = (bestAsk - bestBid).toFixed(2);
      const spreadPercent = ((bestAsk - bestBid) / bestBid * 100).toFixed(2);
      safeSetText('spread', 'Spread: ' + spreadValue + ' (' + spreadPercent + '%)');
    } else {
      safeSetText('spread', 'Spread: Loading...');
    }
  });
}

// ============================================
// PRIVATE KEY FUNCTIONS
// ============================================
const PK_STORAGE_KEY = 'bossx_private_keys';
const PK_FEE = 1;
const PK_MIN_STAKE = 10;
const PK_CODE_LENGTH = 25;

function generateUniqueCode() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = '';
  for (let i = 0; i < PK_CODE_LENGTH; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function loadPrivateKeys() {
  try {
    const data = localStorage.getItem(PK_STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    console.error('Error loading private keys:', e);
    return [];
  }
}

function savePrivateKeys(keys) {
  try {
    localStorage.setItem(PK_STORAGE_KEY, JSON.stringify(keys));
  } catch (e) {
    console.error('Error saving private keys:', e);
    showErrorMessage('Gagal menyimpan data!');
  }
}

function generatePrivateKey() {
  const stakeInput = safeGetEl('pk-stake-amount');
  const stakeAmount = parseFloat(stakeInput?.value) || 0;
  if (stakeAmount < PK_MIN_STAKE) {
    showErrorMessage('Minimal stake adalah ' + PK_MIN_STAKE + ' BossX!');
    appendLog('[ERROR] Generate failed: Stake minimal ' + PK_MIN_STAKE + ' BossX (input: ' + stakeAmount + ')', 'pk-error');
    return;
  }
  const totalRequired = stakeAmount + PK_FEE;
  if (bossxBalance < totalRequired) {
    showErrorMessage('Saldo tidak mencukupi! Dibutuhkan ' + totalRequired + ' BossX (stake + fee)');
    appendLog('[ERROR] Generate failed: Saldo tidak cukup (' + bossxBalance.toFixed(9) + ' BossX < ' + totalRequired + ' BossX)', 'pk-error');
    return;
  }
  const existingKeys = loadPrivateKeys();
  let newCode;
  let attempts = 0;
  do {
    newCode = generateUniqueCode();
    attempts++;
    if (attempts > 100) {
      showErrorMessage('Gagal generate kode unik. Coba lagi.');
      return;
    }
  } while (existingKeys.some(function(k) { return k.code === newCode; }));
  bossxBalance -= totalRequired;
  const newKey = {
    id: Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9),
    code: newCode,
    stake: stakeAmount,
    fee: PK_FEE,
    status: 'AVAILABLE',
    createdAt: new Date().toISOString(),
    redeemedAt: null
  };
  existingKeys.unshift(newKey);
  savePrivateKeys(existingKeys);
  appendLog('[SUCCESS] Access Key generated: ' + newCode + ' | Stake: ' + stakeAmount + ' BossX | Fee: ' + PK_FEE + ' BossX | Total: ' + totalRequired + ' BossX', 'pk-success');
  updateBalanceDisplays();
  updatePKStatistics();
  if (stakeInput) stakeInput.value = '';
  updatePKSummary();
  showSuccessMessage('Access Key berhasil digenerate! Kode: ' + newCode);
  switchPKTab('mykeys');
  updatePrivateKeysList(newKey.id);
  saveValidationState();
}

function redeemPrivateKey() {
  const redeemInput = safeGetEl('redeem-input');
  const code = redeemInput?.value.trim().toUpperCase();
  if (!code) {
    showErrorMessage('Masukkan Access Key terlebih dahulu!');
    appendLog('[ERROR] Redeem failed: Kode kosong', 'pk-error');
    return;
  }
  if (code.length !== PK_CODE_LENGTH) {
    showErrorMessage('Access Key tidak valid! Harus ' + PK_CODE_LENGTH + ' karakter (saat ini: ' + code.length + ')');
    appendLog('[ERROR] Redeem failed: Format invalid (' + code.length + '/' + PK_CODE_LENGTH + ' karakter)', 'pk-error');
    return;
  }
  const keys = loadPrivateKeys();
  const keyIndex = keys.findIndex(function(k) { return k.code === code; });
  if (keyIndex === -1) {
    showErrorMessage('Access Key tidak ditemukan! Pastikan kode benar.');
    appendLog('[ERROR] Redeem failed: Kode tidak ditemukan (' + code + ')', 'pk-error');
    return;
  }
  const key = keys[keyIndex];
  if (key.status === 'REDEEMED') {
    showErrorMessage('Access Key sudah digunakan! Gunakan key yang lain.');
    appendLog('[ERROR] Redeem failed: Key sudah diredeem (' + code + ')', 'pk-error');
    return;
  }
  if (isNodeActive) {
    showErrorMessage('Node sudah aktif! Nonaktifkan node terlebih dahulu.');
    appendLog('[ERROR] Redeem failed: Node sudah aktif', 'pk-error');
    return;
  }
  key.status = 'REDEEMED';
  key.redeemedAt = new Date().toISOString();
  keys[keyIndex] = key;
  savePrivateKeys(keys);
  isNodeActive = true;
  stakedAmount = key.stake;
  const redeemButton = safeGetEl('redeem-button');
  const redeemInputEl = safeGetEl('redeem-input');
  if (redeemButton) {
    redeemButton.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>Node Aktif ✓';
    redeemButton.style.background = 'linear-gradient(145deg, #00FFC8, #00D4A8)';
    redeemButton.disabled = true;
  }
  if (redeemInputEl) redeemInputEl.disabled = true;
  safeSetText('node-status', 'Aktif');
  safeSetStyle('node-status', 'color', '#00FFC8');
  currentValidationReward = 0;
  totalRewardBalance = 0;
  appendLog('[SUCCESS] Access Key redeemed: ' + code + ' | Node activated with ' + key.stake + ' BossX stake', 'pk-success');
  appendLog('[INFO] Reward rate: ' + (key.stake * 0.000000038580246913580247).toFixed(12) + ' BossX/detik');
  updateBalanceDisplays();
  updatePKStatistics();
  if (typeof lucide !== 'undefined') lucide.createIcons();
  showSuccessMessage('Node berhasil diaktifkan dengan stake ' + key.stake + ' BossX! Tekan Power ON untuk mulai validasi.');
  if (redeemInputEl) redeemInputEl.value = '';
  saveValidationState();
}

function copyPrivateKey(code) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function() {
      showSuccessMessage('Access Key disalin: ' + code);
    }).catch(function() {
      fallbackCopyPK(code);
    });
  } else {
    fallbackCopyPK(code);
  }
}

function fallbackCopyPK(text) {
  const textArea = document.createElement('textarea');
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    showSuccessMessage('Access Key disalin: ' + text);
  } catch (err) {
    showErrorMessage('Gagal menyalin. Silakan copy manual.');
  }
  document.body.removeChild(textArea);
}

function submitSfiPost() {
  const textarea = safeGetEl('sfi-compose-text');
  const content = textarea?.value.trim();
  const mediaUrl = safeGetEl('sfi-media-url')?.value.trim();
  if (!content && !mediaUrl) {

    return;
  }
  if (content && content.length > 500) {
    showErrorMessage('Postingan maksimal 500 karakter!');
    return;
  }
  if (mediaUrl && sfiCurrentMedia.type) {
    try {
      new URL(mediaUrl);
    } catch (e) {
      showErrorMessage('URL media tidak valid!');
      return;
    }
  }
  const posts = loadSfiPosts();
  const newPost = {
    id: 'post-' + Date.now(),
    author: 'Fery Muliawan',
    role: 'CEO • BossX',
    avatar: 'FM',
    avatarImage: SFI_TEAM['Fery Muliawan'].image,
    content: content || '',
    media: mediaUrl || null,
    mediaType: sfiCurrentMedia.type,

  };

  saveSfiPosts(posts);

  if (mediaUrlInput) { mediaUrlInput.value = ''; mediaUrlInput.classList.remove('show'); }

  if (preview) preview.classList.remove('show');

  const btnVideo = safeGetEl('sfi-btn-video');
  if (btnImage) btnImage.classList.remove('active');
  if (btnVideo) btnVideo.classList.remove('active');

  renderSfiFeed();
  updateSfiStats();
  showSuccessMessage('Postingan berhasil dipublikasikan!');

function updateSfiStats() {
  const posts = loadSfiPosts();
  const totalPosts = posts.length;
  const totalLikes = posts.reduce(function(sum, p) { return sum + p.likes.length; }, 0);
  const totalComments = posts.reduce(function(sum, p) {
    const c = p.comments.length;
    const r = p.comments.reduce(function(s, cm) { return s + (cm.replies ? cm.replies.length : 0); }, 0);
    return sum + c + r;
  }, 0);
  safeSetText('sfi-stat-posts', totalPosts);
  safeSetText('sfi-stat-likes', totalLikes);
  safeSetText('sfi-stat-comments', totalComments);
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

const THEME_STORAGE_KEY = 'bossx_theme_preference';

function toggleTheme() {
  const body = document.body;
  const themeIcon = safeGetEl('theme-icon');
  const isLightMode = body.classList.contains('light-mode');
  if (isLightMode) {
    body.classList.remove('light-mode');
    if (themeIcon) {
      themeIcon.setAttribute('data-lucide', 'moon');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    localStorage.setItem(THEME_STORAGE_KEY, 'dark');
    showSuccessMessage('🌙 Dark Mode diaktifkan!');
  } else {
    body.classList.add('light-mode');
    if (themeIcon) {
      themeIcon.setAttribute('data-lucide', 'sun');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    localStorage.setItem(THEME_STORAGE_KEY, 'light');
    showSuccessMessage('☀️ Light Mode diaktifkan!');
  }
  localStorage.setItem(THEME_ICON_KEY, isLightMode ? 'moon' : 'sun');
}

function loadThemePreference() {
  const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
  const savedIcon = localStorage.getItem(THEME_ICON_KEY);
  const body = document.body;
  const themeIcon = safeGetEl('theme-icon');
  if (savedTheme === 'light') {
    body.classList.add('light-mode');
    if (themeIcon && savedIcon === 'sun') {
      themeIcon.setAttribute('data-lucide', 'sun');
    }
  } else {
    body.classList.remove('light-mode');
    if (themeIcon) {
      themeIcon.setAttribute('data-lucide', 'moon');
    }
  }
  setTimeout(() => {
    if (typeof lucide !== 'undefined') lucide.createIcons();

let bossxAIHistory = [];
let bossxAIIsOpen = false;
let bossxAIIsMinimized = false;
let bossxAIIsInitialized = false;
let bossxAIWelcomeShown = false;

function showBossxAIFab() {
  const fab = safeGetEl('bossx-ai-fab');
  if (fab) fab.classList.add('visible');
}
function hideBossxAIFab() {
  const fab = safeGetEl('bossx-ai-fab');
  const win = safeGetEl('bossx-ai-window');
  if (fab) fab.classList.remove('visible');
  if (win) win.classList.remove('active');
  bossxAIIsOpen = false;
  bossxAIIsMinimized = false;
}
function initBossxAI() {
  if (bossxAIIsInitialized) return;
  bossxAIIsInitialized = true;
  loadBossxAIHistory();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function loadBossxAIHistory() {
  try {
    const saved = localStorage.getItem('bossx_ai_chat_history');
    if (saved) {
      bossxAIHistory = JSON.parse(saved);
    }
  } catch (e) {
    bossxAIHistory = [];
  }
}
function saveBossxAIHistory() {
  try {
    localStorage.setItem('bossx_ai_chat_history', JSON.stringify(bossxAIHistory.slice(-50)));
  } catch (e) {
    console.error('Error saving AI chat history:', e);
  }
}
function toggleBossxAI() {
  if (bossxAIIsMinimized) {
    bossxAIIsMinimized = false;
    const win = safeGetEl('bossx-ai-window');
    if (win) win.classList.remove('minimized');
    const badge = safeGetEl('bossx-ai-badge');
    if (badge) badge.style.display = 'none';
    return;
  }
  if (bossxAIIsOpen) {
    closeBossxAI();
  } else {
    openBossxAI();
  }
}
function openBossxAI() {
  bossxAIIsOpen = true;
  bossxAIIsMinimized = false;
  const win = safeGetEl('bossx-ai-window');
  if (win) {
    win.classList.add('active');
    win.classList.remove('minimized');
  }
  const badge = safeGetEl('bossx-ai-badge');
  if (badge) badge.style.display = 'none';
  if (typeof lucide !== 'undefined') lucide.createIcons();
  if (!bossxAIWelcomeShown || bossxAIHistory.length === 0) {
    renderBossxAIWelcome();
  } else {
    renderBossxAIHistory();
  }
  const input = safeGetEl('bossx-ai-input');
  if (input) input.focus();
}
function closeBossxAI() {
  bossxAIIsOpen = false;
  const win = safeGetEl('bossx-ai-window');
  if (win) win.classList.remove('active');
}
function minimizeBossxAI() {
  bossxAIIsMinimized = true;
  const win = safeGetEl('bossx-ai-window');
  if (win) win.classList.add('minimized');
}
function clearBossxAIChat() {
  if (bossxAIHistory.length === 0) {
    showSuccessMessage('Chat sudah kosong!');

function renderBossxAIWelcome() {

function renderBossxAIHistory() {
  const body = safeGetEl('bossx-ai-body');
  if (!body) return;
  body.innerHTML = '';
  bossxAIHistory.forEach(function(msg) {
    addBossxAIMessage(msg.role, msg.content, false);

function addBossxAIMessage(role, content, animate) {
  animate = animate !== false;
  const body = safeGetEl('bossx-ai-body');
  if (!body) return;
  const msgDiv = document.createElement('div');
  msgDiv.className = 'bossx-ai-msg ' + role;
  if (animate) msgDiv.style.opacity = '0';
  const avatar = role === 'bot' ? '🤖' : 'U';
  msgDiv.innerHTML = '<div class="bossx-ai-msg-avatar">' + avatar + '</div><div class="bossx-ai-msg-content">' + content + '</div>';
  body.appendChild(msgDiv);
  if (animate) {
    requestAnimationFrame(function() {
      msgDiv.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      msgDiv.style.opacity = '1';
    });
  }
  scrollBossxAIToBottom();
}
function scrollBossxAIToBottom() {
  const body = safeGetEl('bossx-ai-body');
  if (!body) return;
  setTimeout(function() {
    body.scrollTop = body.scrollHeight;
  }, 50);
}
function showBossxAITyping() {
  const body = safeGetEl('bossx-ai-body');
  if (!body) return;
  const typingDiv = document.createElement('div');
  typingDiv.className = 'bossx-ai-msg bot';
  typingDiv.id = 'bossx-ai-typing-indicator';
  typingDiv.innerHTML = '<div class="bossx-ai-msg-avatar">🤖</div><div class="bossx-ai-msg-content" style="padding: 12px 14px;"><div class="bossx-ai-thinking-stage fade-in" id="thinking-stage-text"><div class="bossx-ai-thinking-spinner"></div><span>' + THINKING_STAGES[0].icon + ' ' + THINKING_STAGES[0].text + '</span></div></div>';
  body.appendChild(typingDiv);
  scrollBossxAIToBottom();
  let currentStage = 0;
  const stageInterval = setInterval(function() {
    currentStage++;
    if (currentStage >= THINKING_STAGES.length) { clearInterval(stageInterval); return; }
    const stageText = safeGetEl('thinking-stage-text');
    if (stageText) {
      stageText.classList.remove('fade-in');
      stageText.classList.add('fade-out');
      setTimeout(function() {
        stageText.innerHTML = '<div class="bossx-ai-thinking-spinner"></div><span>' + THINKING_STAGES[currentStage].icon + ' ' + THINKING_STAGES[currentStage].text + '</span>';
        stageText.classList.remove('fade-out');
        stageText.classList.add('fade-in');
        scrollBossxAIToBottom();
      }, 300);
    }
  }, 2000);
  typingDiv.dataset.intervalId = stageInterval.toString();
}
function hideBossxAITyping() {
  const typing = safeGetEl('bossx-ai-typing-indicator');
  if (typing) {
    if (typing.dataset.intervalId) clearInterval(parseInt(typing.dataset.intervalId));
    typing.remove();
  }
}
function playBossxAISound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch (e) {
    console.error('Audio error:', e);
  }
}
function findBossxAIAnswer(userInput) {
  const input = userInput.toLowerCase().trim();
  if (!input) return null;
  let bestMatch = null;
  let bestScore = 0;
  BOSSX_AI_KB.forEach(function(entry) {
    let score = 0;
    entry.keywords.forEach(function(keyword) {
      if (input.indexOf(keyword) !== -1) {
        score += keyword.length;
        if (input === keyword) score += 10;
      }
    });
    const inputWords = input.split(/\s+/);
    entry.keywords.forEach(function(keyword) {
      const kwWords = keyword.split(/\s+/);
      kwWords.forEach(function(kw) {
        if (inputWords.indexOf(kw) !== -1) score += 2;
      });
    });
    if (score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  });
  return bestScore > 0 ? bestMatch : null;
}
function sendBossxAIMessage() {
  const input = safeGetEl('bossx-ai-input');
  const text = input?.value.trim();
  if (!text) return;
  input.value = '';
  addBossxAIMessage('user', escapeHtml(text));
  bossxAIHistory.push({ role: 'user', content: escapeHtml(text) });
  saveBossxAIHistory();
  showBossxAITyping();
  const delay = 6000 + Math.random() * 2000;
  setTimeout(function() {
    hideBossxAITyping();
    const match = findBossxAIAnswer(text);
    let answer;
    if (match) {
      answer = typeof match.answer === 'function' ? match.answer() : match.answer;
    } else {
      answer = BOSSX_AI_FALLBACK;
    }
    addBossxAIMessage('bot', answer);
    bossxAIHistory.push({ role: 'bot', content: answer });
    saveBossxAIHistory();
    playBossxAISound();
  }, delay);
}
function handleBossxAIKey(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    sendBossxAIMessage();
  }
}

let deferredPrompt = null;
const PWA_DISMISS_KEY = 'bossx_pwa_dismissed';

function initPWA() {
  if (!('serviceWorker' in navigator)) {
    console.log('[PWA] Service Worker tidak didukung browser ini');
    return;
  }
  // Register inline service worker untuk menghindari 404
  const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(self.clients.claim())); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl)
    .then(function(registration) {
      console.log('[PWA] Service Worker registered:', registration.scope);
    })
    .catch(function(error) {
      console.warn('[PWA] SW registration failed:', error);
    });
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    const dismissed = localStorage.getItem(PWA_DISMISS_KEY);
    if (dismissed) {
      const dismissedDate = new Date(parseInt(dismissed));
      const daysSinceDismiss = (Date.now() - dismissedDate.getTime()) / (1000 * 60 * 60 * 24);
      if (daysSinceDismiss < 7) return;
    }
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    if (window.navigator.standalone === true) return;
    setTimeout(showPWAInstallBanner, 3000);
  });
  window.addEventListener('appinstalled', function() {
    console.log('[PWA] BossX App berhasil di-install!');
    hidePWAInstallBanner();
    deferredPrompt = null;
    showSuccessMessage('🎉 BossX App berhasil di-install! Buka dari home screen HP Anda.');
  });
}

function showPWAInstallBanner() {
  const banner = safeGetEl('pwa-install-banner');
  if (banner) banner.classList.add('show');
}
function hidePWAInstallBanner() {
  const banner = safeGetEl('pwa-install-banner');
  if (banner) banner.classList.remove('show');
}
function installPWA() {
  if (!deferredPrompt) {
    showManualInstallInstructions();
    return;
  }
  try {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choiceResult) {
      console.log('[PWA] User response to install prompt: ' + choiceResult.outcome);
      deferredPrompt = null;
      hidePWAInstallBanner();
    });
  } catch (err) {
    console.error('[PWA] Install error:', err);
    showManualInstallInstructions();
  }
}
function showManualInstallInstructions() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  let message = '';
  if (isIOS) {
    message = '📱 Cara Install di iPhone/iPad:\n1. Ketuk tombol Share (kotak dengan panah) di Safari\n2. Gulir ke bawah dan pilih "Add to Home Screen"\n3. Ketuk "Add" di pojok kanan atas\n4. BossX App akan muncul di home screen!';
  } else if (isAndroid) {
    message = '📱 Cara Install di Android:\n1. Ketuk menu (⋮) di pojok kanan atas Chrome\n2. Pilih "Install app" atau "Add to Home screen"\n3. Ketuk "Install"\n4. BossX App akan muncul di home screen!';
  } else {
    message = '💻 Cara Install di Desktop:\n1. Klik ikon install (⊕) di address bar browser\n2. Atau tekan menu browser → "Install BossX"\n3. Konfirmasi instalasi\n4. BossX App akan muncul di desktop/start menu!';
  }
  alert(message);
  hidePWAInstallBanner();
}
function dismissPWAInstall() {
  hidePWAInstallBanner();
  localStorage.setItem(PWA_DISMISS_KEY, Date.now().toString());
}

document.addEventListener('DOMContentLoaded', function() {
  const installBtn = safeGetEl('pwa-install-btn');
  const closeBtn = safeGetEl('pwa-install-close');
  if (installBtn) installBtn.addEventListener('click', installPWA);
  if (closeBtn) closeBtn.addEventListener('click', dismissPWAInstall);
  loadThemePreference();
});
